# CI/CD skeleton (System Design §9) — copy sang .github/workflows/ci.yml khi
# repo lên GitHub. Pipeline: lint/test → build → deploy dev → approve →
# staging → approve → production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  # Build-only cho cả 2 target (api, worker) — xác nhận Dockerfile build được
  # trong CI mà KHÔNG push/deploy (spec-sprint-4 FR-S4-1: chuẩn bị deploy-ready,
  # không tự deploy vì chưa có GCP project/credentials thật).
  docker-image:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api    -t shotmate-api:ci    backend/
      - run: docker build --target worker -t shotmate-worker:ci backend/

  # --- Bật các job dưới khi có GCP project + store accounts (xem infra/DEPLOY.md) ---
  #
  # deploy-dev:    push Artifact Registry + gcloud run deploy shotmate-api-dev/shotmate-worker-dev
  #                (auto sau khi test pass trên main; auth qua GitHub OIDC — KHÔNG service account key)
  # deploy-staging: environment: staging (manual approval trong GitHub Environments)
  # deploy-prod:   environment: production (manual approval) + git tag
  # app-release:   Fastlane → Play Internal (Android-only beta — TestFlight dời sau, xem roadmap Phase 5)
