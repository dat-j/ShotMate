# CI/CD skeleton (System Design §9) — copy sang .github/workflows/ci.yml khi
# repo lên GitHub. Pipeline: lint/test → build → deploy dev → approve →
# staging → approve → production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  # --- Sprint 3: bật các job dưới khi có GCP project + store accounts ---
  #
  # docker-image:  build backend/Dockerfile, push Artifact Registry, tag theo version
  # deploy-dev:    gcloud run deploy shotmate-api-dev (auto sau khi test pass trên main)
  # deploy-staging: environment: staging (manual approval trong GitHub Environments)
  # deploy-prod:   environment: production (manual approval) + git tag
  # app-release:   Fastlane → TestFlight / Play Internal (cần signing secrets)
