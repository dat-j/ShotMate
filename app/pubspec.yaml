name: shotmate_app
description: "ShotMate — AI Camera Coach. Realtime guidance truoc khi bam nut chup."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State & navigation (tech-strategy.md)
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Camera preview/capture — analysis chạy ở native module (ADR-0001)
  camera: ^0.11.0
  permission_handler: ^12.0.1

  # Local storage (ADR-0005)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # HTTP (Sprint 3 — backend client)
  dio: ^5.7.0

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

# Firebase (Analytics/Crashlytics/Remote Config) thêm ở Sprint 1 sau khi
# `flutterfire configure` — cần Firebase project trước.
