name: shotmate_app
description: "ShotMate — AI Camera Coach. Realtime guidance truoc khi bam nut chup."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State & navigation (tech-strategy.md)
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Camera preview/capture — analysis chạy ở native module (ADR-0001)
  camera: ^0.11.0
  permission_handler: ^12.0.1

  # Local storage (ADR-0005)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # HTTP (Sprint 3 — backend client)
  dio: ^5.7.0

  uuid: ^4.5.1

  # Auth token storage (Sprint 3 FR-S3-1) — Keychain/EncryptedSharedPreferences,
  # KHÔNG Drift (token không phải "local storage nghiệp vụ" — spec-sprint-3
  # Assumption FR-S3-1, không vi phạm ADR-0005).
  flutter_secure_storage: ^9.2.2

  # Deep link cho magic link auth (shotmate://auth/verify?token=...)
  app_links: ^6.3.0

  # Monetization (Sprint 4 FR-S4-9) — RevenueCat SDK, PaywallScreen thật.
  purchases_flutter: ^10.4.0

  # Resize ảnh trước upload trong isolate (Sprint 4 FR-S4-9, spec FR-S3-2).
  image: ^4.9.1

  # Firebase Analytics/Crashlytics (Sprint 4 FR-S4-9) — init graceful nếu
  # thiếu google-services.json/firebase_options.dart (chưa có Firebase
  # project thật trong môi trường này; xem main.dart).
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

# Firebase Remote Config: chưa thêm — chưa có nhu cầu dùng trong sprint này.
# `flutterfire configure` (sinh firebase_options.dart + google-services.json)
# cần chạy khi có Firebase project thật (Sprint 4 FR-S4-9); tới lúc đó
# `Firebase.initializeApp()` trong main.dart tiếp tục fail gracefully (catch
# + log warning) như đã cài trong sprint này.
